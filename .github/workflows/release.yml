name: Release
on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      candidate:
        description: 'Release candidate.'
        required: true
        type: boolean
        default: true
      test_pypi:
        description: 'Test PyPI.'
        type: boolean
        default: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Set main/stable branch targets from tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "release" && "$RELEASE_TAG" == v1* ]]; then
            echo "main=v1.38.x_main" >> "$GITHUB_OUTPUT"
            echo "stable=v1.38.x_stable" >> "$GITHUB_OUTPUT"
          else
            echo "main=main" >> "$GITHUB_OUTPUT"
            echo "stable=stable" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Get stable and main values
        run: |
          echo "main branch is: ${{steps.version.outputs.main }}"
          echo "stable branch is: ${{ steps.version.outputs.stable }}"
